@if (!loading && !hasLoadError) {
  <img (click)="preview()" class="el-image__inner" [src]="src"
    [style.object-fit]="nelFit" [alt]="nelAlt">
}
@if (loading) {
  <div class="el-image__placeholder">
    @if (nelPlaceholder) {
      <ng-container *stringTemplate="nelPlaceholder">{{nelPlaceholder}}</ng-container>
    }
  </div>
}
@if (hasLoadError) {
  <div class="el-image__error">
    @if (nelError) {
      <ng-container *stringTemplate="nelError">{{nelError}}</ng-container>
    } @else {
      加载失败
    }
  </div>
}
