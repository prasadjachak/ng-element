@if (!loading) {
  <ng-content></ng-content>
} @else {
  @if (nelTemplate) {
    <ng-container *stringTemplate="nelTemplate">{{nelTemplate}}</ng-container>
  } @else {
    @for (row of rowList; track row; let first = $first; let last = $last) {
      <div class="el-skeleton__item el-skeleton__p"
        [class.is-first]="first" [class.is-last]="last" [class.el-skeleton__paragraph]="!first">
      </div>
    }
  }
}
