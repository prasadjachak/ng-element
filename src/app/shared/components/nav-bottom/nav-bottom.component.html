@if (leftLink.link) {
  <span [routerLink]="'/' + type + leftLink.link" class="footer-nav-link footer-nav-left">
    <i class="el-icon-arrow-left"></i>
    {{leftLink.name}}
  </span>
}
@if (rightLink.link) {
  <span [routerLink]="'/' + type + rightLink.link" class="footer-nav-link footer-nav-right">
    {{rightLink.name}}
    <i class="el-icon-arrow-right"></i>
  </span>
}
